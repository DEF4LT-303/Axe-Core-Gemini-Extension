description = "Quick accessibility audit for a URL, local server, or HTML snippet using axe-core"

prompt = """
Use the axe-core accessibility tools to audit the following target: {{args}}.

Instructions:
1. If the target is a URL (starts with http://, https://, or file://):
   - Call the `audit_url` tool for that URL checking standard WCAG 2.1 AA tags.
2. If the target is an HTML snippet or component markup:
   - Call the `audit_html` tool with that markup.
3. If the target is a local file path (e.g. .html, .jsx, .tsx, .vue):
   - Read the file content and call `audit_html` on the markup.

Output Requirements:
- Executive Summary Table: Present the high-level audit results in a Markdown table (Target, Status, Critical, Serious, Moderate, Minor, Total Violations, Passed Rules).
- Violations Table: List all violations in a Markdown table (Rule ID, Severity, Elements Count, Target Selector(s), Description).
- Code Remediation: Below the tables, provide clean, corrected code snippets for each violation.
"""
